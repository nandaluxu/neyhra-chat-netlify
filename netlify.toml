[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "nft"
  # file yang dibaca lewat fs saat runtime (karakter, data game)
  included_files = ["char/**", "data/**", "public/index.html"]

[functions."api"]
  timeout = 26

# URL per layar (SPA, lihat public/router.js)
[[redirects]]
  from = "/chat"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/chat/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/global"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/bonus"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/leaderboard"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/wallet"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/games"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/shop"
  to = "/index.html"
  status = 200
[[redirects]]
